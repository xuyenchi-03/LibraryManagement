<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tác giả – The Quiet Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="page"></main>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/crud.js"></script>
  <script>
    Crud({
      title: 'Tác giả', 
      active: 'authors.html', 
      subtitle: 'Danh sách tác giả có sách trong thư viện.',
      addLabel: 'Thêm tác giả', 
      noun: 'tác giả', 
      endpoint: '/authors', 
      nameKey: 'name',
      searchPlaceholder: 'Tìm theo tên hoặc mô tả', 
      searchKeys: ['name', 'description'],
      deleteWarn: 'Không xóa được tác giả còn sách trong thư viện.',
      columns: [
        { 
          label: 'Tên tác giả', 
          render: (r) => `<b>${Lib.esc(r.name)}</b>` 
        },
        { 
          label: 'Mô tả', 
          render: (r) => Lib.esc((r.description || '—').slice(0, 140)) 
        }
      ],
      fields: [
        { 
          name: 'name', 
          label: 'Tên tác giả', 
          required: true, 
          max: 100, 
          placeholder: 'Ví dụ: Nguyễn Nhật Ánh' 
        },
        { 
          name: 'description', 
          label: 'Mô tả', 
          type: 'textarea', 
          max: 5000, 
          placeholder: 'Không bắt buộc' 
        }
      ]
    });
  </script>
</body>
</html>
